<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kawardha Room Saathi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
      // CRITICAL FIX: Polyfill for process.env
      window.process = {
        env: {
          NODE_ENV: 'production'
        }
      };

      // FETCH PROTECTION: Prevent libraries from trying to overwrite window.fetch
      // which can be read-only in some environments
      try {
        const originalFetch = window.fetch;
        if (originalFetch) {
          try {
            Object.defineProperty(window, 'fetch', {
              configurable: false,
              enumerable: true,
              get: () => originalFetch,
              set: (v) => { console.warn('Blocked attempt to override fetch:', v); }
            });
          } catch (e) {
            // If already not configurable, we can't do much, but the error might stop
            console.log('Fetch is already locked or not configurable');
          }
        }
      } catch (err) {
        console.error('Error in fetch protection:', err);
      }
    </script>
    <style>
      body {
        font-family: 'Poppins', sans-serif;
        background-color: #f9fafb;
      }
      
      /* Custom Animations */
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      
      .animate-fade-in {
        animation: fadeIn 0.5s ease-out forwards;
      }
      
      .delay-100 { animation-delay: 100ms; }
      .delay-200 { animation-delay: 200ms; }
      
      /* Custom scrollbar for chat */
      .scrollbar-hide::-webkit-scrollbar {
          display: none;
      }
      .scrollbar-hide {
          -ms-overflow-style: none;
          scrollbar-width: none;
      }
    </style>
  <link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root">
      <!-- Initial Loading State -->
      <div style="height: 100vh; width: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; background-color: #fff7ed;">
        <div style="width: 40px; height: 40px; border: 4px solid #fed7aa; border-top: 4px solid #ea580c; border-radius: 50%; animation: spin 1s linear infinite;"></div>
        <h2 style="margin-top: 20px; font-family: 'Poppins', sans-serif; color: #c2410c; font-weight: 600;">Starting Room Saathi...</h2>
        <style>
          @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        </style>
      </div>
    </div>
    <!-- THIS IS THE MISSING SCRIPT THAT FIXES THE APP -->
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
